<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="funcion()">Media</button>
    <div id="resultado"></div>

    <script>
        function funcion() { 
            let num=1, salida = "";
            while(num <= 10) {
                salida += num + "<br>";
                num++;
            
            }         
            document.getElementById("resultado").innerHTML = salida;
        }
    </script>
</body>
</html>
