<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="funcion()">Comprueba si el numero es Primo</button>
    <div id="resultado"></div>

    <script>
        function funcion() { 
           let num = prompt("Escribe un número");
           let i, salida = "";
                         
           for(i = 2; i < num; i++) {
                if(num % i === 0) {
                    salida += num + " no es primo<br>";
                    break;
                }
            }
            if(salida === "") {
                salida += num + " es primo<br>";
            }
            document.getElementById("resultado").innerHTML = salida;
        }
    </script>
</body>
</html>
